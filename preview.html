<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>留一格電 Mama’s Last Battery</title>
<meta name="description" content="我先係自己，然後先至係媽媽。每日一局：瞓覺前留到最後 20% 就贏。廣東話、English、繁中、简中。免費、冇廣告、唔使登入。">
<meta name="theme-color" content="#f5ede0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone column. Top = little house whose five windows are mom's battery; a status strip wires mom's % to BB's mood;
   background worries sit under it like phone apps; the sheet below holds what is happening now. Everything on warm beige paper. */
:root{
  --bg:#f5ede0; --bg2:#efe4d2; --surface:#fffaf2; --card:#ffffff; --line:#e6d9c4;
  --ink:#3d332b; --sub:#5f5145; --mute:#75665a;
  --lamp:#f2b84b; --heart:#e8836b; --warm:#fde6b8;
  --good:#3f8a5c; --mid:#b07d14; --low:#bf6324; --red:#b9452f;
  --c-do:#fbe0d4; --c-let:#e2ecf2; --c-help:#ece2f0; --c-delay:#f7e9c2;
  --night:#3e3445; --night2:#4b4054;
  --f-ui:'Noto Sans TC','Noto Sans SC','PingFang HK','PingFang SC','Microsoft JhengHei',sans-serif; --f-hand:'LXGW WenKai TC','Noto Serif TC','Noto Sans SC',serif; --f-num:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hand{font-family:var(--f-hand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:440px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{position:absolute;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:12px;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.brand{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.1}
.daychip{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 10px;border-radius:999px;background:var(--surface);font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(61,51,43,.08)}
.tbtns{display:flex;gap:6px;align-items:center}
.pillbtn{border:0;border-radius:999px;padding:0 13px;height:38px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.ibtn{border:0;width:38px;height:38px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 10px rgba(61,51,43,.12)}
.night .daychip{background:rgba(255,255,255,.9)}
.night .brand{color:#fff}

#scene{position:relative;flex:0 0 auto;height:clamp(196px,29dvh,262px)}
svg.house{display:block;width:100%;height:100%}
#scene svg.house{position:absolute;inset:0;width:100%;height:100%;display:block}
#sceneSvg img.wc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.wcimg{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#clouds{position:absolute;inset:0;z-index:3;pointer-events:none}
.cloud{pointer-events:auto;position:absolute;max-width:62%;border:0;padding:12px 14px 10px;border-radius:24px;background:#8a7d8e;color:#fff;text-align:left;font-weight:700;font-size:13.5px;line-height:1.45;animation:drift 6s ease-in-out infinite alternate;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#8a7d8e;border-radius:50%;z-index:0}
.cloud::before{width:38px;height:38px;left:18px;top:-13px}
.cloud::after{width:48px;height:48px;left:50px;top:-19px}
.cloud span{position:relative;z-index:1}
.cloud.sel{background:#a597a8}.cloud.sel::before,.cloud.sel::after{background:#a597a8}
.cloud.gone{animation:poof .6s forwards}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(8px)}}
@keyframes poof{to{opacity:0;transform:scale(1.25) translateY(-10px)}}

.status{position:relative;z-index:3;margin:-18px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));padding:10px 12px;border-radius:22px;background:var(--card);box-shadow:0 12px 28px rgba(61,51,43,.14);display:grid;grid-template-columns:minmax(0,1fr) 50px 118px;align-items:center;gap:4px}
.momside{display:flex;flex-direction:column;gap:5px;min-width:0}
.momtop{display:flex;align-items:center;gap:7px}
.pct{font-family:var(--f-num);font-weight:600;font-size:28px;line-height:1}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;height:13px}
.segs i{display:block;border-radius:4px;background:#ece3d4}
.seglbl{font-size:11px;color:var(--mute)}
.bbside{display:flex;align-items:center;gap:6px;min-width:0}
.mood{font-weight:900;font-size:15px;line-height:1.2}
.why{font-size:10.5px;color:var(--mute);line-height:1.3}
.cable{width:50px;height:40px;display:block}
.flow{stroke-dasharray:2 8;animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.spark{position:absolute;right:10px;top:-14px;border:0;border-radius:999px;padding:6px 10px;background:var(--lamp);color:var(--ink);font-size:12px;font-weight:900;box-shadow:0 6px 14px rgba(200,140,30,.4);animation:bob 1.4s ease-in-out infinite;z-index:4}
@keyframes bob{50%{transform:translateY(-3px)}}
.alert{margin:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));padding:9px 12px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.45;display:none}
.alert.on{display:block;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.bgw{margin:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:30px}
.bgw .lbl{font-size:12px;font-weight:900;color:var(--sub)}
.bgw .rate{font-size:12px;font-weight:700;color:var(--red)}
.worry{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 10px;background:var(--card);font-size:12.5px;font-weight:700;box-shadow:0 2px 6px rgba(61,51,43,.08)}
.worry b{width:17px;height:17px;border-radius:5px;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.bgw .none{font-size:12.5px;color:var(--mute)}

#sheet{position:relative;flex:1 1 auto;min-height:0;margin-top:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:26px 26px 0 0;background:var(--surface);box-shadow:0 -8px 24px rgba(61,51,43,.08);overflow-y:auto;-webkit-overflow-scrolling:touch}
.handle{width:44px;height:5px;border-radius:9px;background:#e2d6c3;margin:-4px auto 12px}
.time{font-family:var(--f-num);font-size:12px;color:var(--mute)}
h2{margin:2px 0 4px;font-weight:900;font-size:20px;line-height:1.35;text-wrap:balance}
h3{margin:0 0 4px;font-weight:900;font-size:17px;line-height:1.4}
p{margin:0}
.body{font-size:14.5px;line-height:1.65;color:var(--sub)}
.os{font-family:var(--f-hand);font-size:15.5px;color:var(--mute);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--sub)}
.tag.red{background:#f8ddd3;color:#8e3320}
.tag.w{background:#dcebdc;color:#2c5e3c}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.opt{border:0;text-align:left;padding:11px;border-radius:18px;display:flex;flex-direction:column;gap:3px;min-height:84px;color:var(--ink)}
.opt .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.opt b{font-size:15px;font-weight:900}
.opt .c{font-family:var(--f-num);font-size:12.5px;font-weight:600}
.opt .c.neg{color:#8e3320}.opt .c.zero{color:#2c5e3c}
.opt span.d{font-size:12.5px;line-height:1.45;color:var(--sub)}
.opt .wn{font-size:11.5px;color:#8e3320;font-weight:700}
.opt[disabled]{opacity:.42;cursor:not-allowed}
.o-do{background:var(--c-do)}.o-let{background:var(--c-let)}.o-help{background:var(--c-help)}.o-delay{background:var(--c-delay)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{border:0;text-align:left;width:100%;padding:12px 13px;border-radius:16px;background:var(--bg);display:flex;align-items:center;gap:10px;color:var(--ink)}
.row b{font-size:15px;font-weight:900;display:block}
.row span.d{font-size:12.5px;color:var(--mute);display:block}
.row .r{margin-left:auto;font-family:var(--f-num);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--good)}
.row .ic{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card)}
.row[disabled]{opacity:.42}
.new{font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--heart);color:#fff;margin-left:6px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 16px;font-weight:900;font-size:16px;background:var(--ink);color:#fff;text-align:center;margin-top:12px;text-decoration:none}
.btn.warm{background:var(--lamp);color:var(--ink)}
.btn.soft{background:var(--bg2);color:var(--ink)}
.linkbtn{background:none;border:0;padding:8px 0;font-size:14px;font-weight:700;text-decoration:underline;display:block;margin:8px auto 0;color:var(--sub)}
.res{display:flex;gap:12px;align-items:flex-start}
.delta{font-family:var(--f-num);font-weight:600;font-size:20px;white-space:nowrap}
.card2{padding:12px 14px;border-radius:16px;background:var(--bg);margin-top:10px}
.reframe{font-family:var(--f-hand);font-weight:700;font-size:18px;line-height:1.55;color:var(--ink)}
.strike{text-decoration:line-through;font-size:13px;color:var(--mute)}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stat div{padding:10px 12px;border-radius:14px;background:var(--bg)}
.stat b{display:block;font-family:var(--f-num);font-size:19px}
.stat span{font-size:12px;color:var(--mute)}
.prog3{display:flex;gap:6px;align-items:center}
.prog3 i{width:10px;height:10px;border-radius:50%;background:#e2d6c3;display:block}
.prog3 i.on{background:var(--heart)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices button{border:0;text-align:left;padding:13px 14px;border-radius:16px;background:var(--bg);font-weight:700;font-size:15px;color:var(--ink)}
.choices button.sel{background:var(--ink);color:#fff}
.chipsel{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipsel button{border:0;border-radius:999px;padding:10px 14px;background:var(--bg);font-weight:700;font-size:14px;color:var(--ink)}
.chipsel button.sel{background:var(--ink);color:#fff}
textarea,input[type=text]{width:100%;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
.cardimg{display:block;width:62%;margin:12px auto 0;border-radius:14px;box-shadow:0 12px 30px rgba(61,51,43,.25)}
.fine{font-size:12px;line-height:1.6;color:var(--mute);margin-top:12px;text-align:center}

/* overlays */
[hidden]{display:none!important}
#ov,#help{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#help{z-index:40;overflow-y:auto;display:block}
#ov.album{background:#efe4d2}
.inner{max-width:440px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.hinner{max-width:440px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;flex:0 0 auto}
.bar b{font-weight:900;font-size:18px}
.pill{border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--bg2);color:var(--ink);min-height:38px}
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.play{position:relative;flex:1 1 auto;min-height:0;margin-top:8px;border-radius:24px;overflow:hidden;touch-action:none;background:var(--bg2)}
.tip{color:var(--sub);font-size:13px;text-align:center;margin:8px 0 0;min-height:20px}
.goal{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:8px 12px;border-radius:14px;background:var(--warm);color:var(--ink);font-size:13px;font-weight:700}
.goal .gb{border:0;border-radius:999px;padding:8px 12px;background:var(--ink);color:#fff;font-weight:900;font-size:13px;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tcard{border:0;border-radius:22px;padding:12px;background:var(--card);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:0 4px 12px rgba(61,51,43,.06)}
.tcard .art{height:66px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tcard b{font-size:16px;font-weight:900}
.tcard span.d{font-size:12.5px;line-height:1.5;color:var(--sub)}
/* voices */
.arena{position:relative;flex:1;min-height:300px;border-radius:24px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bub{position:absolute;left:0;top:0;max-width:64%;border:0;border-radius:18px;padding:10px 12px;background:#8a7d8e;color:#fff;text-align:left;font-size:14px;font-weight:700;line-height:1.45;will-change:transform}
.bub small{display:block;font-size:11px;color:#efe6f0}
.bub.flip{background:var(--warm);color:var(--ink);pointer-events:none}
.bub.flip small{color:#7a5a20}
.bub.hit{background:#cfc4c9;color:#6f6267;pointer-events:none}
.momg{position:absolute;left:50%;bottom:0;width:140px;height:140px;transform:translateX(-50%);pointer-events:none}
/* bubble wrap */
.wrapsheet{position:absolute;inset:0;padding:12px;background:#ece2d2;display:grid;gap:6px;align-content:center;justify-content:center;transition:transform .45s ease,opacity .45s}
.wrapsheet.out{transform:translateX(-110%);opacity:0}
.wrapsheet.in{transform:translateX(110%);opacity:0}
.bb{border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.4) 15% 34%,rgba(230,215,195,.6) 60%,rgba(200,180,155,.6) 100%);box-shadow:inset -3px -4px 6px rgba(150,120,90,.3),0 2px 3px rgba(120,95,70,.18);transition:transform .08s}
.bb.gold{background:radial-gradient(circle at 34% 30%,#fff 0 14%,rgba(255,240,190,.7) 15% 34%,rgba(242,184,75,.85) 62%,rgba(210,150,50,.9) 100%);box-shadow:inset -3px -4px 6px rgba(190,130,30,.35),0 0 12px rgba(242,184,75,.8)}
.bb.pop{transform:scale(.86);background:radial-gradient(circle,rgba(255,255,255,.3),rgba(210,195,175,.3));box-shadow:inset 0 0 0 1px rgba(170,145,115,.35);position:relative}
.bb.pop::after{content:"";position:absolute;inset:28%;border-top:1.5px solid rgba(150,125,95,.45);border-radius:40%;transform:rotate(-18deg)}
.qcard{position:absolute;left:12px;right:12px;bottom:12px;padding:16px;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 14px 30px rgba(61,51,43,.25);z-index:3}
.qcard small{font-size:12px;font-weight:700;color:#8a6a20}
.qcard p{margin:4px 0 0;font-family:var(--f-hand);font-size:18px;font-weight:700;line-height:1.5}
/* star */
.pchips{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pchip{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.pchip.sel{border-color:var(--ink)}
.jarrow{display:flex;align-items:center;gap:12px;margin-top:10px}
.wishlist{margin:8px 0 0;padding-left:20px;line-height:1.8;font-size:14px;color:var(--sub)}
label.lb{display:block;font-weight:900;font-size:15px;margin:16px 0 8px}
/* city */
.say{position:absolute;left:12px;right:12px;top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,250,242,.97);color:var(--ink);font-size:15px;font-weight:700;line-height:1.5;box-shadow:0 10px 24px rgba(0,0,0,.25);transition:opacity .4s;z-index:3}
.say small{display:block;font-size:11px;color:#7a5a20;font-weight:700}
.win{cursor:pointer}
/* fog */
.play canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.progbar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:8px}
.progbar i{display:block;height:100%;width:0;background:var(--lamp);border-radius:999px;transition:width .3s}
/* coffee */
.cupbtn{display:block;margin:6px auto 0;border:0;background:none;padding:0}
.thermo{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:6px}
.thermo i{display:block;height:100%;background:#d0702f;transition:width .1s linear}
.sips{display:flex;gap:6px;justify-content:center;margin-top:8px}
.sips i{width:14px;height:14px;border-radius:50%;background:var(--bg2);display:block}
.sips i.on{background:#8a5a44}
.intr{margin-top:10px;padding:14px;border-radius:18px;background:var(--card);box-shadow:0 8px 24px rgba(61,51,43,.15);min-height:112px}
.intr .q{font-weight:900;font-size:16px;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.two button{border:0;border-radius:14px;padding:12px;font-weight:900}
.sipbig{display:block;margin:10px auto 0;border:0;border-radius:999px;padding:14px 26px;background:var(--lamp);font-weight:900;font-size:17px;box-shadow:0 8px 20px rgba(200,140,30,.35);animation:pulse 1.4s ease-in-out infinite}
.sipbig[disabled]{animation:none;opacity:.4}
@keyframes pulse{50%{transform:scale(1.05)}}
.flash{font-size:13px;font-weight:700;min-height:20px;text-align:center;margin-top:6px;color:var(--sub)}
/* breathing */
.breathwrap{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:14px auto 6px;max-width:100%}
.breathwrap svg{position:absolute;inset:0;width:100%;height:100%}
.breathcore{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.breathcore .bl{font-weight:900;font-size:22px}
.breathcore .bn{font-family:var(--f-num);font-weight:600;font-size:64px;line-height:1}
.breathcore .bs{font-size:12px;font-weight:700}
.breathphoto{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px #fff}
.breathphoto img,.breathphoto svg{width:100%;height:100%;object-fit:cover;display:block}
/* mindfulness */
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;border-radius:999px;background:var(--bg2);margin-top:10px}
.seg2 button{border:0;border-radius:999px;padding:10px;background:transparent;font-weight:700;font-size:14.5px;color:var(--sub)}
.seg2 button.sel{background:var(--ink);color:#fff}
.playbtn{width:104px;height:104px;border-radius:50%;border:0;background:var(--lamp);display:flex;align-items:center;justify-content:center;margin:18px auto 8px;box-shadow:0 0 0 14px rgba(242,184,75,.18),0 0 0 28px rgba(242,184,75,.08)}
.subbox{margin-top:12px;padding:16px;border-radius:20px;background:var(--card);min-height:92px;display:flex;align-items:center}
.subbox p{font-family:var(--f-hand);font-weight:700;font-size:19px;line-height:1.6;color:var(--ink)}

function cupSVG(t){var steam=t>60?'<path d="M84 30c-6-8 6-12 0-20M104 30c-6-8 6-12 0-20M124 30c-6-8 6-12 0-20" stroke="#c9b8a6" stroke-width="4" fill="none" stroke-linecap="round"/>':'';

/* --- breathing (fixed: one engine, countdown + ring + scale all in sync) --- */
function breathing(el,cycles,photo,onDone){
  var IN=4,OUT=6,T=IN+OUT,total=cycles*T,start=null,raf=0,lastPh='';
  el.innerHTML='<div class="breathwrap"><svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="136" fill="none" stroke="#e6d9c4" stroke-width="10"/><circle class="bring" cx="150" cy="150" r="136" fill="none" stroke="#e8836b" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 855" transform="rotate(-90 150 150)"/>'+(photo?'':'<circle class="bcore" cx="150" cy="150" r="70" fill="#f2b8a0" opacity=".9"/>')+'</svg>'+
   (photo?'<div class="breathphoto bph">'+photo+'</div>':'<div class="breathcore"><span class="bl">'+X.chill.bin+'</span><span class="bn">4</span><span class="bs">'+X.chill.bsec+'</span></div>')+'</div>'+
   (photo?'<div style="text-align:center;font-weight:900;font-size:20px"><span class="bl">'+X.chill.bin+'</span>　<span class="bn mono">4</span></div>':'')+
   '<div class="prog3" style="justify-content:center;margin-top:8px">'+Array.apply(null,{length:cycles}).map(function(){return '<i></i>'}).join('')+'<span class="bc" style="margin-left:6px;font-size:15.5px;font-weight:700">'+fmt(X.chill.bcount,{a:1,b:cycles})+'</span></div>';
  var ring=$('.bring',el),core=$('.bcore',el),ph=$('.bph',el),bl=$('.bl',el),bn=$('.bn',el),bc=$('.bc',el),dots=$$('.prog3 i',el);
  function ease(x){return 0.5-0.5*Math.cos(Math.PI*x)}
  function tick(now){
    if(start===null)start=now;var t=(now-start)/1000;
    if(t>=total){ring.setAttribute('stroke-dasharray','855 855');bl.textContent=X.chill.bwell;bn.textContent='';onDone&&onDone();return}
    var cyc=Math.floor(t/T),w=t-cyc*T,inh=w<IN,f=inh?w/IN:(w-IN)/OUT,sc=inh?0.62+0.38*ease(f):1-0.38*ease(f),rem=Math.ceil(inh?IN-w:T-w);
    if(!RM){if(core)core.setAttribute('r',(70*sc/0.81).toFixed(1));if(ph)ph.style.transform='translate(-50%,-50%) scale('+(0.8+0.2*(sc-0.62)/0.38).toFixed(3)+')'}
    bl.textContent=inh?X.chill.bin:X.chill.bout;bn.textContent=rem;bc.textContent=fmt(X.chill.bcount,{a:cyc+1,b:cycles});
    dots.forEach(function(d,i){d.className=i<=cyc?'on':''});
    ring.setAttribute('stroke-dasharray',(855*t/total).toFixed(1)+' 855');
    var phk=cyc+(inh?'i':'o');if(phk!==lastPh){lastPh=phk;tone(inh?392:329.6,0.5,0.05,'sine')}
    raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
  return function(){cancelAnimationFrame(raf)};
}

/* --- mindfulness (Katy's recordings) --- */
function gMind(mode){
  var min=5,au=null,playing=false,fallback=false,ftimer=null,fstart=0,fel=0,doneF=false,wake=null;
  function render(){
    C.innerHTML=chillHead('mind',mode)+'<div class="scroll"><div class="row" style="background:var(--card)"><span class="ic" style="background:var(--lamp)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3d332b" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span><b>'+X.chill.mindT+'</b><span class="d">'+X.chill.mindD+'</span></span></div>'+

     '<div class="progbar"><i id="mp"></i></div><div style="display:flex;justify-content:space-between" class="mono time"><span id="mt">00:00</span><span>'+(min===5?'05:00':'15:00')+'</span></div>'+
     '<div class="subbox"><p id="sub">'+MSUB(min).l[0]+'</p></div><p class="fine" id="note">'+(mode?(mode.night?X.chill.mindNight:fmt(X.chill.mindCharge,{m:min,r:mode.reward})):X.chill.mindPhones)+''+'</p></div>';
    chillBind('mind',mode);
    cqa('.seg2 button').forEach(function(b){b.onclick=function(){stopAll();min=+b.getAttribute('data-m');render()}});
    cq('#pp').onclick=toggle;
  }
  function playIcon(){return playing?'<svg width="38" height="38" viewBox="0 0 24 24" fill="#3d332b" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>':'<svg width="40" height="40" viewBox="0 0 24 24" fill="#3d332b" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>'}
  function upd(sec){if(!C)return;var Ln=MIND_LEN[min],MS=MSUB(min),line=MS.l[0];MS.t.forEach(function(s0,i){if(sec>=s0)line=MS.l[i]});
    var mp=cq('#mp'),mt=cq('#mt'),sb=cq('#sub');if(mp)mp.style.width=Math.min(100,sec/Ln*100)+'%';if(mt)mt.textContent=hm2(sec);if(sb&&sb.textContent!==line)sb.textContent=line;
    if(!doneF&&sec>=Ln*0.9){doneF=true;progress(mode,1)}}
  function hm2(s){s=Math.floor(s);var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
  function grabWake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}}
  function toggle(){
    ac();
    if(!playing){
      playing=true;cq('#pp').innerHTML=playIcon();cq('#pp').setAttribute('aria-label',X.chill.pause);grabWake();
      if(!fallback){
        if(!au){var a=new Audio(MAUD(min));au=a;a.preload='auto';a.addEventListener('timeupdate',function(){if(au===a)upd(a.currentTime)});a.addEventListener('ended',function(){if(au!==a)return;sBell();upd(MIND_LEN[min]);playing=false;var b=cq('#pp');if(b)b.innerHTML=playIcon()});a.addEventListener('error',function(){if(au===a)useFallback()})}
        if(au.currentTime===0)sBell();

      }else startTimer();

      if(au&&!fallback)au.pause();if(fallback){clearInterval(ftimer);fel+=(Date.now()-fstart)/1000}
      try{if(wake){wake.release();wake=null}}catch(e){}
    }
  }
  function useFallback(){if(fallback)return;fallback=true;if(au){try{au.pause()}catch(e){}}var n=cq('#note');if(n)n.textContent=X.chill.mindFail;if(playing)startTimer()}

  function stopAll(){if(au){try{au.pause()}catch(e){}au=null}clearInterval(ftimer);playing=false;fel=0;doneF=false;fallback=false;if(mode)mode.n=0;try{if(wake){wake.release();wake=null}}catch(e){}}
  render();
  ovStop=stopAll;
}

/* ---------- day building ---------- */
function okEv(id,used){var e=EVDEF[id];return e&&!ndSkipEv(id)&&ageOk(e,id)&&hasNeed(e)&&!used[id]&&evText(id)}
function drawEv(slot,pref){
  var used={};S.plan.forEach(function(x){if(x.id)used[x.id]=1});
  if(pref)for(var i=0;i<pref.length;i++)if(okEv(pref[i],used)&&EVDEF[pref[i]].s===slot){S.recent[pref[i]]=S.day;return pref[i]}
  var pool=Object.keys(EVDEF).filter(function(id){return EVDEF[id].s===slot&&okEv(id,used)});
  if(!pool.length&&slot==='house')pool=Object.keys(EVDEF).filter(function(id){return EVDEF[id].s==='pm'&&okEv(id,used)});
  if(!pool.length&&slot==='remote')pool=Object.keys(EVDEF).filter(function(id){return EVDEF[id].s==='work'&&okEv(id,used)});
  if(!pool.length&&(slot==='wkend'||slot==='sunday'))pool=Object.keys(EVDEF).filter(function(id){return (EVDEF[id].s==='pm'||EVDEF[id].s==='wkend')&&okEv(id,used)});
  var gaps=[4,3,2,1,0];
  for(var g=0;g<gaps.length;g++){var c=pool.filter(function(id){return S.recent[id]===undefined||S.day-S.recent[id]>=gaps[g]});if(c.length){var id=rnd(c);S.recent[id]=S.day;return id}}
  return null;
}
function buildDay(){
  S.plan=[];
  var tpl=S.day===6?SAT:(S.day===7?SUN:BASE[S.work]).slice();
  var ins=INSERTS[S.day]||[];
  if(ND())tpl=tpl.filter(function(y){return y[0]!=='dad'});
  ins.forEach(function(x){if(x[0]==='info:helperout')return;if(ND()&&x[0]==='info:dadot')return;if(ND()&&x[0]==='voice:husband')x=['voice:self',x[1]];if(x[2]==='dad')tpl=tpl.filter(function(y){return y[0]!=='dad'});if(x[2]==='helper'&&!S.helper)return;tpl.push([x[0],x[1]])});
  tpl.sort(function(a,b){return a[1]-b[1]});
  tpl.forEach(function(sl){
    var k=sl[0],tm=sl[1];
    if(k.indexOf('charge:')===0){if(k==='charge:commute'&&(S.day===2||S.day===4)&&S.helper)return;S.plan.push({t:tm,k:'charge',c:k.slice(7)})}
    else if(k.indexOf('voice:')===0){var v=k.slice(6);if(v==='fri')v=S.work==='home'?'money':(S.age==='b'?'relatives':'teacher');S.plan.push({t:tm,k:'voice',v:v})}
    else if(k.indexOf('info:')===0)S.plan.push({t:tm,k:'info',i:k.slice(5)});
    else if(k==='dilemma')S.plan.push({t:tm,k:'dilemma'});
    else if(k==='dad'&&S.trust>=60&&!S.dadGood&&Math.random()<0.6)S.plan.push({t:tm,k:'dadgood'});
    else{var id=drawEv(k,S.day===4&&k==='pm'?['doctor','elder']:null);if(id){var e=EVDEF[id];S.plan.push({t:e.t&&k==='am'?e.t:tm,k:'ev',id:id})}}
  });
  S.tom.forEach(function(x,i){var at=Math.min(1+i,S.plan.length-1);S.plan.splice(at,0,{t:S.plan[at].t,k:'ev',id:x,d:true})});S.tom=[];
  S.plan.sort(function(a,b){return a.t-b.t});
}

  S.p=S.hm?TUNE.hmStart:(lastLose?TUNE.startLose:TUNE.startWin);S.clock=S.day===7?8:7;S.si=0;S.worries=[];S.burst=false;S.helpToday=false;S.letToday=0;S.attachToday=false;
  S.weather=null;S.spark=null;S.sparkN=0;S.night=null;S.dadOT=false;S.helperOut=false;S.grandUsed=0;S.helperUsed=0;S.sosLeft=TUNE.sosMax+(!S.helper&&!S.grand?1:0);S.waUsed=false;S.friendUsed=false;S.dadHelp=-1;S.lastL=lvl(S.p);

function done1(){S.si++;save()}
function bbExtra(e){return e.bb&&S.p<40?5:0}
function costs(e,it){
  var ex=bbExtra(e),tx=dadTax(e),r={};
  r.do=e.do!==undefined?Math.max(0,Math.round(e.do*TUNE.doMult*(S.hm?TUNE.hmDo:1))+ex+tx):null;
  r.let=(e.let!==undefined&&evText(e.id)[4])?Math.max(0,Math.round((e.let||0)*TUNE.letMult)+TUNE.letBase+(e.let?ex:0)+Math.max(0,tx)):null;
  r.help=e.h.length&&evText(e.id)[5]?(e.hc||0):null;

function doSOS(k){
  var r=Math.random(),gain=0,msg='',tu=0;
  if(k==='wa'){sendMsg(t('waText')+' '+GAME_URL);if(!S.waUsed){S.waUsed=true;gain=3}msg=t('sosWAok')}
  else{S.sosLeft--;S.used.sos++;S.used.help++;
    if(k==='dad'){var p=dadRate();if(r<p){gain=TUNE.sosGain;msg=t('sosDadOk');tu=trustUp(TUNE.trustOk-2);S.dadHelp=S.si}else if(r<p+(1-p)*0.4){gain=Math.round(TUNE.sosGain/2);msg=rnd(X.dad.half);tu=trustUp(TUNE.trustHalf)}else{gain=-3;msg=rnd(X.dad.no);tu=trustUp(TUNE.trustFail)}}
    else if(k==='grand'){S.grandUsed++;if(r<0.85){gain=TUNE.sosGain-2;msg=t('sosGrandOk');if(Math.random()<0.5){gain-=2;msg+='<br>'+rnd(X.grandR.comment)}}else{msg=rnd(X.spR.no)}}

function playVoice(V){
  var lines=V[3],flipped=[],hits=[],bubs=[],spawned=0,tm=0,last=0,raf=0,dur=RM?7:3.6,gap=RM?2.4:1.25;
  if(window.__fast){lines.forEach(function(Ln){if(Math.random()<window.__fast.deflect)flipped.push(Ln);else{hits.push(Ln);sub(TUNE.voiceHit)}});openOv();end();return}
  openOv();
  C.innerHTML='<div class="bar"><b>'+t('voiceFly',{who:V[0]})+'</b><span class="mono" id="ovp" style="font-size:15px;color:#8e3320">'+Math.round(S.p)+'%</span></div><p class="body">'+t('voiceTip',{n:TUNE.voiceHit})+'</p><div class="arena" id="ar"><div id="mb">'+momGlow(S.p)+'</div></div>';
  var ar=cq('#ar');
  function spawn(){var Ln=lines[spawned++],Wd=ar.clientWidth,H=ar.clientHeight,b=document.createElement('button');b.className='bub';b.innerHTML='<small>'+Ln[0]+'</small>'+Ln[1];ar.appendChild(b);
    var bw=b.offsetWidth,bh=b.offsetHeight,o={el:b,L:Ln,x0:Math.random()*Math.max(1,Wd-bw),y0:-bh,x1:Wd/2-bw/2,y1:H-120-bh/2,p:0,st:'fly',life:0,ph:Math.random()*6,sp:1+spawned*0.15};o.x=o.x0;o.y=o.y0;
    b.onclick=function(){if(o.st!=='fly')return;o.st='flip';o.life=0;b.className='bub flip';b.innerHTML='<small>'+t('bounced')+'</small>'+Ln[2];o.x=Math.max(4,Math.min(o.x,ar.clientWidth-b.offsetWidth-4));flipped.push(Ln);sChime()};bubs.push(o)}
  function tick(now){var dt=last?Math.min(0.05,(now-last)/1000):0;last=now;tm+=dt;
    if(spawned<lines.length&&tm>=0.3+spawned*gap)spawn();
    bubs.forEach(function(o){var x,y;
      if(o.st==='fly'){o.p+=dt/dur*o.sp;x=o.x0+(o.x1-o.x0)*o.p+Math.sin(o.ph+tm*2.4)*26;y=o.y0+(o.y1-o.y0)*o.p;o.x=x;o.y=y;
        if(o.p>=1){o.st='hit';o.life=0;o.el.className='bub hit';hits.push(o.L);sub(TUNE.voiceHit);sDown();var op=cq('#ovp');if(op)op.textContent=Math.round(S.p)+'%';var mb=cq('#mb');if(mb)mb.innerHTML=momGlow(S.p)}}
      else{o.life+=dt;x=o.x;y=o.y-(o.st==='flip'?o.life*24:0);o.el.style.opacity=String(Math.max(0,1-o.life/(o.st==='flip'?3:1.5)))}
      o.el.style.transform='translate('+x+'px,'+y+'px)';
      if(o.st!=='fly'&&o.life>(o.st==='flip'?3:1.5)){o.el.remove();o.dead=true}});
    bubs=bubs.filter(function(o){return !o.dead});
    if(spawned>=lines.length&&!bubs.length){end();return}
    raf=requestAnimationFrame(tick)}
  raf=requestAnimationFrame(tick);
  ovStop=function(){cancelAnimationFrame(raf)};
  function end(){ovStop=null;closeOv();S.deflect+=flipped.length;S.hit+=hits.length;done1();hero(true);if(S.p<=0){lose('now');return}
    var h='<div class="res">'+resLine(hits.length*TUNE.voiceHit)+'<div><h3>'+t('voiceRes',{a:flipped.length,b:lines.length})+'</h3><p class="body">'+(hits.length?t('voiceHit'):t('voiceClean'))+'</p></div></div>';
    h+='<div class="list">'+lines.map(function(Ln){return '<div class="card2" style="margin:0"><div class="strike">'+Ln[0]+CL()+Ln[1]+'</div><div class="reframe" style="font-size:16px">'+Ln[2]+'</div></div>'}).join('')+'</div><button class="btn" id="go">'+t('next')+'</button>';
    sheet(h);$('#go').onclick=show}
}

var MSUBS={"en5":[[0,3.5,6.4,9.1,11.6,23,27.5,31.6,36.4,39.6,42.1,45.0,69,73.2,76.7,80.5,82.8,99,105.2,107.5,111.3,115.8,133,138.6,141.6,146.0,150.7,152.3,170,173.9,179.0,181.1,185.0,205,215.5,219.2,239,243.2,251.6,277,280.8,283.9,286.6,289.4],["Thank you for giving yourself these five minutes.","Now, make yourself comfortable.","You can sit, or you can lie down.","Let your hands rest gently by your sides.","And when you're ready, slowly close your eyes.","We'll begin with three slow, deep breaths.","Breathe in, and feel your belly gently rise.","Breathe out, and feel your body soften, and sink a little deeper.","Once more, breathe in, and breathe out.","And one last time, in, and out.","Then just let your breathing find its own natural rhythm.","There's nothing you need to control.","Now, bring your attention back into your body.","Feel the places where your body meets the chair, or the bed.","Feel that weight, and that support beneath you.","You don't need to do anything at all.","Right now, your body is right here, holding you.","Gently bring your awareness to the top of your head, and then down to your forehead.","Let the little space between your brows soften.","Soften your eyelids, your cheeks, and your jaw.","And if you notice a little tension anywhere, that's perfectly okay.","Just noticing it is enough.","Let your attention drift down into your neck, and your shoulders.","Your shoulders carry so much for you, day after day.","Just for now, let them drop a little, and let them rest.","Then move slowly down into your hands, your palms, and each one of your fingers.","Notice how they feel right now.","Warm, perhaps, or a little cool.","Now feel your back, your chest, and your belly.","Notice the soft rise and fall of each breath.","You don't need to change your breathing in any way.","It knows how to arrive, and it knows how to leave.","All you need to do is be here, and keep it company.","Let your attention travel down once more, to your hips, your thighs, your calves, all the way down to the soles of your feet, and your toes.","Your feet carry you to so many places, every single day.","Now, let them truly rest. There's nothing to do, and nowhere to go.","Now, sense your whole body, all of it, as one.","And if somewhere still feels tight, or a little uncomfortable, there's no need to push it away, and no need to be hard on yourself.","Just breathe gently into that place, and stay with it, kindly, for a little while.","Our practice is coming to a close.","Gently wiggle your fingers, and your toes.","Notice the sounds around you, and the feel of the air.","And when you're ready, slowly open your eyes.","Thank you, for stopping today, and for listening to your body."]],"en15":[[0,3.3,6.6,10.0,17.5,20.5,23.2,45,48.9,55.2,59.8,63.6,64.1,67.8,71.7,101,104.2,105.8,111.5,116.8,120.3,144,150.5,154.9,160.2,163.1,191,198.1,200.3,203.5,207.2,212.8,217.8,245,254.3,259.9,266.8,298,300.4,308.7,313.9,318.9,322.5,347,352.2,360.8,363.1,364.9,369.4,394,398.1,403.5,407.8,412.6,441,444.5,452.6,453.1,458.7,490,499.7,508.1,511.4,514.5,540,544.9,550.0,554.6,580,584.1,587.9,591.1,596.1,598.3,623,629.6,632.4,637.7,667,670.5,676.0,679.9,683.5,712,717.5,720.2,723.5,727.5,754,760.9,767.5,774.2,778.1,809,814.7,818.2,821.5,826.9,828.8,856,860.6,863.2,870.0,873.5,880.8,883.6,887.3],["Welcome to this body scan practice.","These next fifteen minutes are just for you.","Now, find a quiet, comfortable place to rest.","You can sit in a chair, with your feet flat on the floor, or you can lie down, with your head and your body fully supported.","Let your hands rest gently by your sides, or in your lap.","And when you're ready, slowly close your eyes.","If at any point you feel uncomfortable, or a little dizzy, you can open your eyes at any time, move around a little, and look after yourself first.","We'll settle in with the breath.","Breathe in slowly, and feel the cool air moving through your nostrils, into your body.","Breathe out slowly, and feel your body soften, and sink a little deeper.","Once more, breathe in, and breathe out.","And one last time, in, and out.","Then let go of controlling the breath.","Allow it to return to its own natural rhythm.","You'll notice it's been here all along, quietly keeping you company.","Bring your attention back to your whole body.","Feel the weight of your body.","Feel your hips, your back, and your feet, where they meet the chair, the floor, or the bed.","Notice the pressure, the warmth, and that simple feeling of being supported.","Right now, you don't need to go anywhere, and you don't need to get anything done.","All you need to do is be here, and reconnect with your body.","We'll begin at the top of the head, and slowly make our way through the whole body.","Bring your attention to the crown of your head, and feel the skin there.","You might notice a little tingling, a little tightness, or perhaps nothing at all.","Whatever you find, there's no right or wrong.","We're simply listening, with curiosity, to the signals your body is sending you right now.","Let your attention move gently down to your forehead, softening that small band of muscle between your brows.","Down to your eyelids, and your eyes.","Let them rest. They don't need to look at anything.","Down to your cheeks, your nose, your lips, and your jaw.","Let your teeth come a little apart, and allow your lips to part, just slightly.","You might be surprised how many tiny muscles in your face work hard for you all day long.","Now, let them all soften, together.","Move your attention down into your neck, the neck that holds your head up so faithfully, every day.","Then down into your shoulders, your left shoulder, and your right shoulder.","So often, our shoulders creep up toward our ears without us even noticing, as if they're carrying the weight of the world.","Now, with each out-breath, let your shoulders melt down a little more, and set down, just for now, anything that doesn't belong to this moment.","Now bring your attention to your right side.","Beginning at your right shoulder, travel slowly down your upper arm, your elbow, your forearm, your wrist, into your palm, and into each of your fingers.","Notice which finger you can feel most clearly, and which one you can barely feel at all.","Notice the temperature of your skin, and the faint, gentle pulse in your fingertips.","And if there's no feeling, that's a feeling too.","Simply knowing is enough.","Now, slowly bring your attention over to your left side.","With that same gentleness, move across your left shoulder, your upper arm, your elbow, your forearm, your wrist, your palm, and each of your fingers.","Notice if this side feels any different from the right.","A little warmer, a little tighter.","It's all perfectly normal. We don't need to make the two sides the same.","We just meet them, exactly as they are.","Bring your attention to your chest.","Feel how it gently expands as you breathe in, and softens back down as you breathe out.","Or perhaps you can feel your heartbeat, one beat, then another, calm and steady.","Your heart works for you every day, without ever asking for a rest.","Just for a moment, quietly thank it, and rest here with it.","Turn your attention to your back.","Beginning in your upper back, move slowly down your spine, one part at a time, all the way to your lower back.","Your back holds you up, all day long.","If there's some pressure there, or some tiredness, you don't need to push it away.","Imagine that with each out-breath, you hand a little of that weight back to the chair, or back to the bed, and allow your back to rest.","Now, feel your belly. Notice how it gently rises as you breathe in, and settles back down as you breathe out.","Notice any sensations inside, perhaps a soft gurgling, a feeling of fullness, or of emptiness, or perhaps nothing much at all.","The body's signals can be very quiet.","We don't need to work them out, or judge them.","Simply noticing them is already a kindness.","Bring your attention down to your pelvis, and your hips.","Feel the weight of your body resting against the surface beneath you, and the steadiness of your pelvis.","This is the place that connects your upper body to your legs.","Let it soften completely now, and trust the ground to hold the weight of your body for you.","Now bring your attention to your right thigh.","Feel the muscles of your thigh, your knee, your calf, all the way down to your ankle.","Your legs carry you through so much, every day.","And if your calf feels a little tight, or a little tired, just stay with it kindly.","Let your breath keep it company.","There's no need to push anything away.","Let your attention arrive at the sole of your right foot, and your toes.","Feel whatever your foot is touching, fabric, or air.","Go through your toes one by one, your big toe, the second, the third, the fourth, and your little toe.","And in your heart, quietly say to your right foot, thank you, for taking me everywhere I need to go.","Slowly now, bring your attention to your left thigh.","With that same patience, move across your knee, your calf, and down to your ankle.","Notice if your left leg feels any different from your right.","Perhaps one feels lighter, and the other a little heavier.","Whatever you find, this is your body, telling you the truth of this moment.","Let your attention settle on the sole of your left foot, and on each of your toes.","Notice the contact, and the temperature.","Now feel both of your feet, and both of your legs, letting go together.","They don't need to hurry anywhere, and they don't need to hold you up.","For this moment, they can rest, completely.","Now, let the breath carry you through your whole body one more time.","As you breathe in, imagine a soft wave of awareness rising from the soles of your feet, all the way to the top of your head.","As you breathe out, let it flow back down, from your head, to your feet.","Your whole body, breathing together, resting together.","And you, just here, quietly, with your body.","Finally, bring your attention to the one place in your body that calls to you most.","It might be the tightest place, or the most peaceful place.","There's no need to judge it, and no need to fix it.","Just breathe gently into it, as if you were saying, I know you're there, and I'm here with you.","So often, our body doesn't need us to fix it.","It just wants to be heard.","Our practice is coming to a close.","Slowly bring your awareness back to your whole body.","Notice the sounds around you, the temperature of the air, and the room you're in.","Gently wiggle your fingers, and your toes, and let your body wake up, in its own time.","You might like to have a stretch, then roll gently onto your right side, and press yourself up to sitting.","And when you're ready, slowly open your eyes.","Thank you, for giving yourself these fifteen minutes today.","May you carry this quiet steadiness with you, back into your day."]],"cn5":[[0,4.4,10.9,13.4,25,29.2,32.8,36.6,40.2,43.5,68,72.6,77.5,80.2,83.5,100,106.7,112.5,115.4,133,137.0,140.6,144.3,150.3,170,176.4,179.7,184.9,205,214.1,216.1,219.1,237,242.4,251.9,275,277.8,281.6,286.2,289.1],["谢谢你，愿意把这五分钟留给自己。","现在，请找一个舒服的姿势，你可以坐着，也可以躺下来。","把双手轻轻放在身体两侧。","准备好之后，请慢慢地闭上眼睛。","让我们一起，先做三个缓慢的深呼吸。","吸气，感受腹部轻轻地鼓起来。","呼气，感受身体，一点一点地沉下去。","再来一次，吸气，呼气。","最后一次，吸气，呼气。","然后，请让呼吸恢复自然，不需要刻意去控制它。","请把注意力，慢慢带回到你的身体。","感受身体与椅子，或者与床，接触的地方。","感受那份重量，那份托住你的力量。","你不需要做任何事情。","这一刻，身体就在这里，稳稳地陪着你。","现在，请把注意力，轻轻带到头顶，再慢慢来到额头。","放松你的眉心，放松眼皮，放松脸颊，还有下巴。","如果发现哪里有一点紧，不用担心。","能够觉察到，就已经很好了。","让注意力来到脖子，和肩膀。","肩膀每天都替我们扛着很多东西。","现在，请让它们轻轻地垂下来，松一松。","再慢慢来到双手，手掌，还有每一根手指。","感受一下，它们现在，是暖暖的，还是凉凉的。","接着，感受一下你的后背，胸口，还有腹部。","留意每一次呼吸，带来那微微的起伏。","呼吸不需要调整，它自己会来，也会走。","你要做的，只是静静地，在这里陪着它。","让注意力继续向下，来到骨盆，大腿，小腿，一直来到脚底，还有脚趾。","双脚每天带着我们走很远的路。","现在，请让它们好好地休息一下。","什幺都不用做，哪里都不用去。","现在，感受一下你的整个身体，它是一个完整的整体。","如果有哪个地方，仍然有一点紧，或者有一点不舒服，不需要赶它走，也不需要责怪自己。","请轻轻地把呼吸带到那里，温柔地，陪它待一会儿。","我们的练习，慢慢来到尾声。","请轻轻动一动你的手指，还有脚趾。","感受一下周围的声音，还有空气。","当你准备好的时
