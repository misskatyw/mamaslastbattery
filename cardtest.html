<!DOCTYPE html><html><head><meta charset="utf-8"><title>cardtest3</title></head><body>
<div id="log" style="font:15px monospace;white-space:pre-wrap"></div>
<iframe id="gm" src="index.html?debug" style="width:380px;height:600px;border:1px solid #999"></iframe>
<script>
function log(s){document.getElementById('log').textContent+=s+'\n'}
window.onerror=function(m){log('WINDOW ERROR: '+m)};
function stats(g,x0,y0,x1,y1){var d=g.getImageData(x0,y0,x1-x0,y1-y0).data,seen={},n=0;for(var i=0;i<d.length;i+=16){var k=d[i]+','+d[i+1]+','+d[i+2];if(!seen[k]){seen[k]=1;n++}}return n}
window.addEventListener('load',function(){setTimeout(function(){
  try{
    var w=document.getElementById('gm').contentWindow;
    log('typeof drawTextCard='+(typeof w.drawTextCard)+' drawWC='+(typeof w.drawWC)+' cardArt='+(typeof w.cardArt)+' miniHouse='+(typeof w.miniHouse));
    log('WCI: '+(w.WCI?('complete='+w.WCI.live.complete+' nw='+w.WCI.live.naturalWidth+' nh='+w.WCI.live.naturalHeight):'MISSING'));
    var race=Promise.race([w.WC_READY.then(function(){return 'WC_READY resolved'}),new Promise(function(r){setTimeout(function(){r('WC_READY TIMEOUT 3s')},3000)})]);
    race.then(function(msg){log(msg);
      var cv=w.document.createElement('canvas');
      w.drawTextCard(cv,{kind:'quote',text:'媽媽也是第一次當媽媽',shape:'story'}).then(function(){
        var g=cv.getContext('2d');
        log('quote card artzone colors = '+stats(g,280,290,800,550));
        log('quote card toDataURL len = '+cv.toDataURL('image/png').length);
        var cv2=w.document.createElement('canvas');
        return w.drawTextCard(cv2,{kind:'status',text:'test',p:50,shape:'story'}).then(function(){
          var g2=cv2.getContext('2d');
          log('status card midzone colors = '+stats(g2,240,300,840,600));
        });
      }).catch(function(e){log('drawTextCard REJECTED: '+(e&&e.message)+' | '+(e&&e.stack&&e.stack.split('\n').slice(0,3).join(' <- ')))});
    });
  }catch(e){log('SETUP THREW: '+(e&&e.message))}
},5000)});
</script></body></html>
